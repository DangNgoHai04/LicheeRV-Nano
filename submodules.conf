# ============================================================================
# submodules.conf — file cấu hình DÙNG CHUNG cho add_submodules.sh
# và update_submodules.sh
# ============================================================================
#
# BASE_URL: khai báo 1 lần ở đây. Khi nào đổi username/org GitHub, chỉ cần
# sửa đúng 1 dòng này, KHÔNG cần sửa lại từng dòng repo bên dưới.
#
BASE_URL=https://github.com/DangNgoHai04

# ----------------------------------------------------------------------------
# FORMAT mỗi dòng repo (4 cột, cách nhau bởi dấu "|"):
#
#     repo|branch|path|commit_hash
#
#   repo
#       - Nếu chỉ ghi tên ngắn (vd "buildroot") => script tự ghép thành
#         "$BASE_URL/buildroot.git"
#       - Nếu ghi URL đầy đủ (bắt đầu bằng http(s):// hoặc git@) => dùng
#         nguyên URL đó, bỏ qua BASE_URL (dùng khi 1 repo lẻ nằm ở chỗ khác)
#
#   branch
#       Branch cần checkout 
#
#   path
#       Thư mục submodule sẽ nằm trong repo cha
#
#   commit_hash   (TUỲ CHỌN — có thể để trống)
#       - Nếu có: update_submodules.sh sẽ PIN chính xác submodule vào đúng
#         commit này (git checkout --detach <hash>), bất kể branch có commit
#         mới hơn hay không.
#       - Nếu để trống (vẫn phải giữ dấu "|" cuối dòng): update_submodules.sh
#         sẽ chỉ checkout branch + pull mới nhất, không pin cứng commit nào.
#
# Muốn ADD REPO MỚI sau này: chỉ cần thêm 1 dòng vào cuối file rồi chạy lại
# add_submodules.sh (các dòng cũ đã add sẽ tự bị SKIP, không add trùng).
# ----------------------------------------------------------------------------

